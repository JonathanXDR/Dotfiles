# The varlock monorepo is an 18 MB tarball for one small skill. The npm package
# ships the same skill in 1 MB, but only at a pinned version, and a pin would
# have to be bumped by hand. Tracking the branch keeps the skill current on its
# own, which is worth more here than the bandwidth.
[agent_skills.varlock]
repo = "dmno-dev/varlock"
path = "skills/varlock"

[agent_skills.vueuse-functions]
repo = "vueuse/skills"
path = "skills/vueuse-functions"

# --------------------------------- HeroUI ---------------------------------- #

# The vendor's own tarball, the one https://heroui.com/install downloads. It is
# 11 KB against 3 MB for a tarball of the heroui repository, which carries the
# whole component library to extract one skill.
[agent_skills.heroui-react]
url = "https://heroui.com/skills/heroui-react.tar.gz"

# Licensed, and the license forbids redistributing any part of the package, so
# these two can only ever be fetched from HeroUI with a personal token. The
# token lives in the dotfiles keychain under the (`token`, `account`) pair
# below, the same lookup key `secret:set` uses, and reaches the download as a
# request header.
[agent_skills.heroui-react-pro]
url = "https://docs.heroui.pro/docs/skills/heroui-react-pro.tar.gz"
token = "HeroUI Pro"
account = "jonathan"
header = "x-heroui-personal-token"

[agent_skills.heroui-pro-design-taste]
url = "https://docs.heroui.pro/docs/skills/heroui-pro-design-taste.tar.gz"
token = "HeroUI Pro"
account = "jonathan"
header = "x-heroui-personal-token"

# ---------------------------------- Own ------------------------------------ #

# Written here rather than published, because it documents an employer's
# internal stack. This repository is public, so the contents live in a private
# repository and chezmoi clones them. Edit the clone in place under
# agent_skills_home and push from there. Any later apply fast-forwards it, and
# refuses rather than guesses if the clone has uncommitted work or has diverged
# from the remote.
[agent_skills.stake-engine-slot-development]
git = "git@github.com:JonathanXDR/stake-engine-slot-development-skill.git"
