# Agent Skills this machine should have, and where each one comes from. This
# file is the whole inventory: nothing installs a skill that is not listed here.
#
# Every skill is materialized once, into agent_skills_home, and shared from
# there. .chezmoiexternal.toml.tmpl turns most entries below into a chezmoi
# external, so `chezmoi apply` fetches what is missing and re-downloads it every
# agent_skills_refresh. Two kinds of entry need no external: a licensed one,
# which run_after_10-agent-skills downloads because chezmoi cannot send the
# token header, and a repository-owned one, which is already in the source tree.
# That same script links every skill into the agents that need a link, and
# reports any skill that did not arrive.
#
# To add a skill, add an entry. To remove one, delete its entry. Either way the
# next `chezmoi apply` converges. See ARCHITECTURE.md for the full picture.

# Where the one resolved copy of every skill lives, relative to $HOME. The
# Agent Skills discovery convention names ~/.agents/skills as the shared
# personal location, and OpenAI Codex, GitHub Copilot CLI and Gemini CLI all
# read it with no configuration at all. agent_skills_link_dirs below covers the
# agents that do not.
agent_skills_home = ".agents/skills"

# Agent skill directories that get a symlink per skill, for agents that do not
# read agent_skills_home themselves. Each entry is skipped unless the agent's
# own directory already exists, so an agent this machine does not have costs
# nothing.
#
# Only Claude Code needs this. It reads ~/.claude/skills and nothing else, and
# a per-skill symlink there is the mechanism its own documentation describes.
# Codex, Copilot and Gemini are deliberately absent: each already finds the
# shared directory, and a second copy would only spend their skill budget
# listing everything twice.
agent_skills_link_dirs = [
  ".claude/skills", # Claude Code
]

# How often chezmoi re-downloads a skill, unless its entry overrides it. Any
# apply past this age refreshes, so keeping skills current needs no separate
# workflow. Pass `--refresh-externals` to force a download before it is due.
agent_skills_refresh = "168h"

# People whose entire published catalogue is wanted, rather than named skill by
# skill. `skills:sync` resolves this list through the skilld.dev registry and
# rewrites .chezmoidata/skills-owners.toml from it. The resolved entries are
# committed, so an apply never talks to the registry and a new machine gets
# exactly what this repository records.
#
# A skill named in this file wins over one the registry would generate for a
# watched owner, which is how an exception is made. `skills:sync` reports each
# one it skipped for that reason.
agent_skill_owners = [
  "antfu",
  "danielroe",
  "harlan-zw",
  "mattpocock",
]

# One entry per skill, keyed by the directory name it gets under
# agent_skills_home, sorted by that name. It is also what every agent shows in
# its skill list, so keep it equal to the `name` in the skill's own SKILL.md.
# Two skills cannot share a name, so where two sources offer the same one, the
# project's own repository wins over a third-party copy.
#
# Exactly one source key per entry decides where the contents come from:
#
#   repo   GitHub repository, fetched as a branch tarball. Add `path` when the
#          skill is a subdirectory of a larger repository, and `ref` when it
#          does not live on the default branch. This covers everything public.
#   url    A tarball published by the vendor rather than by a git host. Use it
#          when the vendor ships the skill on its own, because a repository
#          tarball downloads the whole repository to extract one directory.
#   git    A clone URL, for a repository chezmoi cannot fetch as a tarball.
#          That means a private repository, where the tarball endpoint needs
#          credentials but `git clone` over SSH already has them.
#   local  No source at all. This repository owns the skill, and its contents
#          live in dot_agents/skills/<name>/, which chezmoi symlinks into
#          agent_skills_home like any other plain file. Use it for a skill with
#          no appropriate upstream that is small enough and safe enough to
#          commit here, remembering that this repository is public.
#
# Two optional keys apply to any entry:
#
#   refresh  Overrides agent_skills_refresh for one entry. Set on every source
#            whose tarball is 25 MB or more, because a `repo` entry downloads
#            the whole repository to extract one directory, and a handful of
#            these are hundreds of megabytes, one of them 825 MB. Refreshing
#            every source weekly would move about 2.1 GB a week. This splits it
#            into 270 MB weekly and 1.9 GB quarterly.
#   token    Names a managed keychain entry (see `secrets:list`) and marks the
#            skill as licensed: run_after_10-agent-skills downloads `url` with
#            the token in the `header` request header, because chezmoi
#            externals cannot send one. Nothing about the license reaches git.
#
# Every entry is declared here whatever its source, because the same list also
# decides what gets linked into each agent and what gets removed when it goes.

