# Shared non-secret data for chezmoi templates, available as {{ .editor }} and
# so on. Most values reach the shell through private_dot_exports.tmpl, which
# assigns each one to the shell variable named in its comment. Those are
# exported, except HISTSIZE, SAVEHIST and HISTORY_IGNORE, which stay unexported
# because zsh reads them as shell parameters.

# Shell defaults
editor = "vi"                # EDITOR and KUBE_EDITOR
history_size = 32768         # HISTSIZE and SAVEHIST
autostart_ssh_agent = false  # AUTOSTART_SSH_AGENT

# Command prefixes kept out of shell history, via HISTORY_IGNORE and the
# zshaddhistory hook in private_dot_exports.tmpl
history_ignore = ["claude", "codex", "copilot", "gh copilot"]

# Hostname that hostname:reset restores, exported as DEFAULT_HOSTNAME
default_hostname = "void(0)"

# Paths that tre and trec leave out, exported as TREE_IGNORE
tree_ignore = ".git|node_modules|.DS_Store|dist|build|target|__pycache__|.venv|.next|.nuxt|.svelte-kit|.gradle|coverage"

# Dock layout that dock:reset rebuilds, exported as DOCK_APPS
dock_apps = [
  "Zen",
  "Zed",
  "Notion",
  "Visual Studio Code",
  "Microsoft Teams",
  "Discord",
  "GitKraken",
]

# Basenames that rm deletes outright instead of trashing, exported as TRASH_SKIP
trash_skip = ["node_modules"]

# Binary that the vpn:* functions drive, exported as CISCO_VPN_BIN
cisco_vpn_bin = "/opt/cisco/secureclient/bin/vpn"

# Hosts for the @swisscom npm scope. Both serve the same virtual repo, but
# only the proxied one is reachable through the corporate proxy and only the
# direct one without it. dot_zshenv.tmpl exports them, proxy:set, proxy:unset
# and proxy-watchd swap the active one, and .npmrc reads the result.
# Applied on work machines only.
npm_swisscom_registry_proxied = "https://artifactory.swisscom.com/artifactory/api/npm/swisscom-npm-virtual/"
npm_swisscom_registry_direct = "https://bin.swisscom.com/artifactory/api/npm/swisscom-npm-virtual/"

# Host vpn:full-refresh reconnects to when called without an argument,
# exported as VPN_DEFAULT_HOST. Empty means the argument is required.
vpn_default_host = ""

# Dedicated keychain for managed secrets, separate from the login keychain.
# `keychain_name` becomes ~/Library/Keychains/<name>.keychain-db.
# `keychain_lookup_field` picks the attribute the template helper searches on:
# name (Label / -l), where (Service / -s), kind (Description / -D), or comment
# (Comments / -j). Identifiers passed to the secret:* functions and to
# `includeTemplate "keychain"` are matched against that attribute.
keychain_name = "dotfiles"      # SECRETS_KEYCHAIN_NAME
keychain_lookup_field = "name"  # SECRETS_KEYCHAIN_LOOKUP_FIELD

# Paths Claude Code must never read or modify. Rendered from this one list into
# both enforcement layers: permissions.deny in private_dot_claude/
# private_settings.json.tmpl, and the blocklist baked into the
# block-path-access.sh guard hook. Not exported to the shell.
#
# Prefer a bare name. It matches that file or directory at any depth, so it
# still covers the file when the path is spelled another way: ~/.ssh is a
# symlink into iCloud on this machine, and a bare .ssh guards the target and any
# copy of it, where the entry "~/.ssh" would only guard the one spelling.
# A bare name matches between path-component boundaries, and a dot closes a
# component without opening one, so .env covers .env and .env.local but not
# .envelope, and .aws does not fire on an identifier like awsRegion.
#
# An entry containing a slash is instead matched as a literal path, where ~
# means the home directory. Write such an entry absolute or ~-rooted: the deny
# layer anchors a bare relative path to the working directory, while the hook
# matches it anywhere, and the two would disagree.
#
# Do not use a glob character. The hook matches entries literally and would
# cover nothing, while the deny rules would read it as a gitignore wildcard.
claude_blocked_paths = [
  # The iCloud backup directory whose tokens file holds every managed
  # secret in cleartext.
  ".keychain",
  ".ssh",
  ".gnupg",
  ".aws",
  ".kube",
  ".env",
]
